<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vulnixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cyberVGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c15"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Faceted Shield Base -->
  <path d="M60 10 L102 28 V64 C102 89 60 110 60 110 C60 110 18 89 18 64 V28 Z" 
        fill="url(#bgGrad)" stroke="url(#vulnixGrad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Geometric Cyber 'V' Wings -->
  <!-- Left Wing -->
  <path d="M34 36 L52 36 L60 68 L50 72 L34 36 Z" fill="url(#cyberVGrad)" opacity="0.9"/>
  <!-- Right Wing -->
  <path d="M86 36 L68 36 L60 68 L70 72 L86 36 Z" fill="url(#vulnixGrad)" opacity="0.9"/>
  <!-- Center Chevron Notch -->
  <polygon points="60,74 52,65 60,34 68,65" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>

  <!-- Radar / Node Intersection Points -->
  <circle cx="60" cy="34" r="3" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="34" cy="36" r="2.5" fill="#06b6d4"/>
  <circle cx="86" cy="36" r="2.5" fill="#6366f1"/>
  <circle cx="60" cy="94" r="3.5" fill="#22d3ee" filter="url(#glow)"/>

  <!-- Dynamic Scan Trace -->
  <line x1="60" y1="78" x2="60" y2="92" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
</svg>
